name: Compilar aplicação Blazor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v4
      - name: Configurar .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar
        run: dotnet build BlazorUsersJsonPlaceHolderApi/BlazorUsersJsonPlaceHolderApi.csproj --configuration Release
